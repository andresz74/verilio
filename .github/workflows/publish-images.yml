name: Publish official images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing exact Verilio release tag (vX.Y.Z[-prerelease])
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: verilio-publish-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'andresz74/verilio'
    runs-on: ubuntu-24.04
    outputs:
      qualified_artifact: ${{ steps.qualified_evidence.outputs.artifact-id }}
      publication_artifact: ${{ steps.final_evidence.outputs.artifact-id }}
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      VERILIO_PLATFORM: linux/amd64
      VERILIO_ALLOW_UNRELEASED_BUILD: "false"
      DATABASE_URL: postgresql://verilio:verilio@127.0.0.1:5432/verilio
    steps:
      - name: Validate requested version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || {
            echo 'An explicit release version is required; floating tags/snapshots are forbidden.' >&2
            exit 1
          }
      - name: Check out exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tagged source and official contract
        run: ./deploy/verify-official-release-source.sh "$VERSION"
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Set up repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.1.0" # Matches deploy/Dockerfile
          cache: pnpm
      - name: Set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Full source qualification
        run: |
          trap 'docker compose -f docker-compose.yml down --volumes --remove-orphans' EXIT
          docker compose -f docker-compose.yml up --detach --wait --wait-timeout 90 postgres
          pnpm db:migrate
          pnpm db:generate
          test -z "$(git status --porcelain)"
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm test:e2e
          pnpm test:deploy
          pnpm build
      - name: Build once and qualify the official archive release
        run: |
          ./deploy/build-release.sh "$VERSION"
          api_id=$(docker image inspect --format '{{.Id}}' "verilio-api:$VERSION")
          gateway_id=$(docker image inspect --format '{{.Id}}' "verilio-gateway:$VERSION")
          mkdir -p "$RUNNER_TEMP/verilio-sbom"
          node deploy/release-evidence.mjs capture "$VERSION" "$(git rev-parse HEAD)" "$api_id" "$gateway_id" "$RUNNER_TEMP/verilio-sbom/candidate.json"
          ./deploy/test-release.sh "$VERSION" --expected-images "$RUNNER_TEMP/verilio-sbom/candidate.json"
          ./deploy/export-release.sh "$VERSION" "$RUNNER_TEMP/verilio-export"
          printf 'VERILIO_VERSION=%s\n' "$VERSION" > "$RUNNER_TEMP/verilio-archive.env"
          "$RUNNER_TEMP/verilio-export/verilio-$VERSION/deploy/verify-release-provenance.sh" --loaded-images "$RUNNER_TEMP/verilio-archive.env"
          cmp compose.prod.yml "$RUNNER_TEMP/verilio-export/verilio-$VERSION/compose.prod.yml"
          grep -Fx "source_commit=$(git rev-parse HEAD)" "$RUNNER_TEMP/verilio-export/verilio-$VERSION/release-manifest.txt"
          test "$api_id" = "$(docker image inspect --format '{{.Id}}' "verilio-api:$VERSION")"
          test "$gateway_id" = "$(docker image inspect --format '{{.Id}}' "verilio-gateway:$VERSION")"
          ./deploy/verify-official-release-source.sh "$VERSION"
          echo "VERILIO_QUALIFIED_API_IMAGE_ID=$api_id" >> "$GITHUB_ENV"
          echo "VERILIO_QUALIFIED_GATEWAY_IMAGE_ID=$gateway_id" >> "$GITHUB_ENV"
          node deploy/release-evidence.mjs qualify "$RUNNER_TEMP/verilio-sbom/candidate.json" "$RUNNER_TEMP/verilio-sbom/qualification.json"
      - name: Obtain verified pinned Syft
        run: node deploy/release-evidence.mjs install-scanner "$RUNNER_TEMP/verilio-syft"
      - name: Generate and validate exact-image SBOM evidence
        run: |
          ./deploy/generate-release-sbom.sh --qualification "$RUNNER_TEMP/verilio-sbom/qualification.json" --output-dir "$RUNNER_TEMP/verilio-evidence" --syft "$RUNNER_TEMP/verilio-syft/syft"
      - name: Preserve required pre-publication evidence
        id: qualified_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ env.VERSION }}-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}-qualified
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/verilio-evidence/qualification.json
            ${{ runner.temp }}/verilio-evidence/evidence.json
            ${{ runner.temp }}/verilio-evidence/checksums.txt
            ${{ runner.temp }}/verilio-evidence/api.spdx.json
            ${{ runner.temp }}/verilio-evidence/gateway.spdx.json
            ${{ runner.temp }}/verilio-evidence/api.scan.json
            ${{ runner.temp }}/verilio-evidence/gateway.scan.json
      - name: Revalidate evidence before authentication
        run: node deploy/release-evidence.mjs validate "$RUNNER_TEMP/verilio-evidence" "$VERSION" "$(git rev-parse HEAD)"
      - name: Log in after all qualification passes
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true
      - name: Publish tested images and verify anonymous access
        run: ./deploy/publish-release-images.sh "$VERSION" --evidence-dir "$RUNNER_TEMP/verilio-evidence"
      - name: Preserve final publication evidence
        id: final_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ env.VERSION }}-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}-published
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/verilio-evidence/publication.json
            ${{ runner.temp }}/verilio-evidence/attempt-status.json
      - name: Record evidence delivery result
        if: always()
        env:
          FINAL_EVIDENCE_OUTCOME: ${{ steps.final_evidence.outcome }}
        run: |
          if [[ -d "$RUNNER_TEMP/verilio-evidence" ]]; then
            delivery=incomplete
            [[ "$FINAL_EVIDENCE_OUTCOME" != success ]] || delivery=uploaded
            node deploy/release-evidence.mjs status "$RUNNER_TEMP/verilio-evidence" delivery "$delivery"
            [[ "$delivery" == uploaded ]] || echo 'Evidence finalization incomplete; inspect this attempt. Never blindly republish immutable tags.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve safe attempt diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ env.VERSION }}-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}-incomplete
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/verilio-evidence/attempt-status.json
            ${{ runner.temp }}/verilio-evidence/qualification.json
            ${{ runner.temp }}/verilio-evidence/evidence.json
            ${{ runner.temp }}/verilio-evidence/checksums.txt
            ${{ runner.temp }}/verilio-evidence/publication.json
            ${{ runner.temp }}/verilio-evidence/api.spdx.json
            ${{ runner.temp }}/verilio-evidence/gateway.spdx.json
            ${{ runner.temp }}/verilio-evidence/api.scan.json
            ${{ runner.temp }}/verilio-evidence/gateway.scan.json
      - name: Clean up development PostgreSQL even on failure
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans

  sign:
    # Deliberately literal/default-off. Owner-reviewed activation requires the
    # disposable GHCR/OIDC experiment, policy update and release cutover decision.
    if: ${{ false && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # Exact same-run artifact metadata/download only.
      packages: write
      id-token: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check out trusted workflow implementation, not application tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Initialize private signing Docker configuration
        shell: bash
        run: |
          umask 077
          docker_config=$(mktemp -d "${RUNNER_TEMP:?}/verilio-sign-auth.XXXXXX")
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
      - name: Set up receipt validator Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.1.0"
      - name: Retrieve exact same-attempt evidence and validate completed chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFIED_ARTIFACT: ${{ needs.publish.outputs.qualified_artifact }}
          PUBLICATION_ARTIFACT: ${{ needs.publish.outputs.publication_artifact }}
        run: |
          python3 deploy/signing/release_signatures.py receive --version "$VERSION" --artifact-ids "$QUALIFIED_ARTIFACT" "$PUBLICATION_ARTIFACT" --output-dir "$RUNNER_TEMP/verilio-sign-input"
          node deploy/release-evidence.mjs validate-publication "$RUNNER_TEMP/verilio-sign-input"
      - name: Obtain reviewed pinned Cosign
        run: python3 deploy/signing/release_signatures.py install --output-dir "$RUNNER_TEMP/verilio-cosign"
      - name: Authenticate signature attachment only
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true
      - name: Sign immutable pair and verify anonymously
        id: paired_signatures
        run: ./deploy/sign-release-images.sh --evidence-dir "$RUNNER_TEMP/verilio-sign-input" --output-dir "$RUNNER_TEMP/verilio-sign-output" --cosign "$RUNNER_TEMP/verilio-cosign/cosign"
      - name: Preserve bounded signature evidence including partial outcomes
        id: signing_evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signatures-${{ env.VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/verilio-sign-output/attempt-status.json
            ${{ runner.temp }}/verilio-sign-output/signing.json
            ${{ runner.temp }}/verilio-sign-output/api.sigstore.json
            ${{ runner.temp }}/verilio-sign-output/gateway.sigstore.json
            ${{ runner.temp }}/verilio-sign-output/portable/api.sigstore.json
            ${{ runner.temp }}/verilio-sign-output/portable/gateway.sigstore.json
            ${{ runner.temp }}/verilio-sign-output/portable/api.manifest.json
            ${{ runner.temp }}/verilio-sign-output/portable/gateway.manifest.json
            ${{ runner.temp }}/verilio-sign-output/portable/api.config.json
            ${{ runner.temp }}/verilio-sign-output/portable/gateway.config.json
            ${{ runner.temp }}/verilio-sign-output/portable/verification.json
      - name: Report signing evidence delivery separately
        if: always()
        env:
          DELIVERY: ${{ steps.signing_evidence.outcome }}
          SIGNING: ${{ steps.paired_signatures.outcome }}
        run: |
          acceptance=incomplete
          if [[ "$SIGNING" == success && "$DELIVERY" == success ]]; then acceptance=paired-verified; fi
          echo "Signing acceptance: $acceptance; evidence delivery: $DELIVERY. Never rerun publication as recovery." >> "$GITHUB_STEP_SUMMARY"
