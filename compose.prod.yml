x-logging: &bounded-logging
  driver: local
  options:
    max-file: "5"
    max-size: 20m

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_USER: verilio_admin
      VERILIO_DB_NAME: verilio
      VERILIO_DB_USER: verilio_app
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verilio_app -d verilio"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 128mb
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      - verilio_pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-verilio-app-role.sh:ro
    logging: *bounded-logging
    networks:
      - backend

  migrate:
    image: verilio-api:${VERILIO_VERSION:?Set VERILIO_VERSION to an explicit release tag}
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      LOCAL_USER_ID: ${LOCAL_USER_ID:?Set the recovery-critical LOCAL_USER_ID}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    secrets:
      - database_url
    logging: *bounded-logging
    networks:
      - backend

  api:
    image: verilio-api:${VERILIO_VERSION:?Set VERILIO_VERSION to an explicit release tag}
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL_FILE: /run/secrets/database_url
      LOCAL_USER_ID: ${LOCAL_USER_ID:?Set the recovery-critical LOCAL_USER_ID}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    secrets:
      - database_url
    logging: *bounded-logging
    networks:
      - backend

  gateway:
    image: verilio-gateway:${VERILIO_VERSION:?Set VERILIO_VERSION to an explicit release tag}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${VERILIO_GATEWAY_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config:size=8m,mode=0777
      - /data:size=8m,mode=0777
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging
    networks:
      - frontend
      - backend

networks:
  frontend:
    internal: false
  backend:
    internal: true

secrets:
  database_url:
    file: ${VERILIO_DATABASE_URL_SECRET:-/etc/verilio/secrets/database_url}
  postgres_admin_password:
    file: ${VERILIO_POSTGRES_ADMIN_PASSWORD_SECRET:-/etc/verilio/secrets/postgres_admin_password}
  postgres_app_password:
    file: ${VERILIO_POSTGRES_APP_PASSWORD_SECRET:-/etc/verilio/secrets/postgres_app_password}

volumes:
  verilio_pgdata:
    name: ${VERILIO_PGDATA_VOLUME:-verilio_pgdata}
