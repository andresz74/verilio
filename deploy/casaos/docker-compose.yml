name: verilio-casaos

x-logging: &bounded-logging
  driver: local
  options:
    max-file: "5"
    max-size: 20m

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_USER: verilio_admin
      VERILIO_DB_NAME: verilio
      VERILIO_DB_USER: verilio_app
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verilio_app -d verilio"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 128mb
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      - /DATA/VerilioState/postgres:/var/lib/postgresql/data
      - type: bind
        source: /DATA/VerilioState/support/init-app-role.sh
        target: /docker-entrypoint-initdb.d/10-verilio-app-role.sh
        read_only: true
    logging: *bounded-logging
    networks:
      - backend

  migrate:
    image: ghcr.io/andresz74/verilio-api:v0.1.1-alpha.5
    env_file:
      - /DATA/VerilioState/config/runtime.env
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    secrets:
      - database_url
    logging: *bounded-logging
    networks:
      - backend

  api:
    image: ghcr.io/andresz74/verilio-api:v0.1.1-alpha.5
    env_file:
      - /DATA/VerilioState/config/runtime.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      DATABASE_URL_FILE: /run/secrets/database_url
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    secrets:
      - database_url
    logging: *bounded-logging
    networks:
      - backend

  gateway:
    image: ghcr.io/andresz74/verilio-gateway:v0.1.1-alpha.5
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config:size=8m,mode=0777
      - /data:size=8m,mode=0777
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging
    networks:
      - frontend
      - backend

networks:
  frontend:
    internal: false
  backend:
    internal: true

secrets:
  database_url:
    file: /DATA/VerilioState/secrets/database_url
  postgres_admin_password:
    file: /DATA/VerilioState/secrets/postgres_admin_password
  postgres_app_password:
    file: /DATA/VerilioState/secrets/postgres_app_password


x-casaos:
  id: io.verilio.app
  main: gateway
  index: /
  scheme: http
  port_map: "8080"
  icon: https://raw.githubusercontent.com/andresz74/verilio/main/apps/web/public/favicon.svg
  title:
    en_US: Verilio
  tagline:
    en_US: Private time tracking and invoicing for a solo freelancer
  description:
    en_US: >-
      Fixed-owner private alpha. Run bootstrap first to prepare protected external
      state at /DATA/VerilioState. Before Install, change Gateway Host from
      127.0.0.1:8080 to a selected trusted-private host IP:8080. API and PostgreSQL
      remain unpublished. Direct public Internet exposure is unsupported.
  tips:
    before_install:
      en_US: >-
        Not one-click. Run sudo ./bootstrap.sh from the complete package first.
        In Custom Install change Gateway Host 127.0.0.1:8080 to your selected
        trusted LAN/VPN/private-interface IP:8080 (tested: 192.168.56.2:8080).
        Do not use 0.0.0.0. Preserve /DATA/VerilioState for recovery.
  author: andresz74
  developer: Verilio
  category: Productivity
  architectures:
    - amd64
  version: "0.1.1-alpha.5"
  update_at: "2026-10-07"
  repo: https://github.com/andresz74/verilio
  support: https://github.com/andresz74/verilio/issues
  docs: https://github.com/andresz74/verilio/blob/main/deploy/casaos/README.md
